services:
  web:
    build: .
    container_name: akarangabank-web

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__AkarangaBank: "Host=db;Port=5432;Database=akaranga_bank;Username=akaranga;Password=${POSTGRES_PASSWORD:?Mot de passe PostgreSQL absent ou vide dans .env}"
      Database__AutoMigrate: "true"

      BootstrapAdmin__Email: "hjohnha@gmail.com"
      BootstrapAdmin__Password: "${BOOTSTRAP_ADMIN_PASSWORD:?Mot de passe administrateur absent ou vide dans .env}"

    depends_on:
      - db

  db:
    image: postgres:16
    container_name: akarangabank-db

    environment:
      POSTGRES_USER: akaranga
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Mot de passe PostgreSQL absent ou vide dans .env}"
      POSTGRES_DB: akaranga_bank

    ports:
      - "5432:5432"

    volumes:
      - akarangabank_db_data:/var/lib/postgresql/data

volumes:
  akarangabank_db_data: